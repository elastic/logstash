input {
  generator {
    lines => ["FIPS compliance test message"]
    count => 10
    add_field => { "[@metadata][source]" => "generator" }
  }

  http {
    port => 8443
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash.key"
    ssl_supported_protocols => ["TLSv1.2"]
  }
}

filter {
  if [@metadata][source] != "generator" {
    mutate {
      add_tag => ["http_input"]
    }
  }
}

output {
  if [@metadata][source] == "generator" {
    http {
      url => "https://logstash:8443"
      http_method => "post"
      format => "json"
      ssl_enabled => true
      ssl_verification_mode => "full"
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
      ssl_supported_protocols => ["TLSv1.2"]
    }
  } else {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      user => "elastic"
      password => "changeme"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
      index => "http-input-test-%{+YYYY.MM.dd}"
    }
  }
}
