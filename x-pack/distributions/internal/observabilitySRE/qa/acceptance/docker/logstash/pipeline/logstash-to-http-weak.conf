input {
  generator {
    lines => ["FIPS compliance test message"]
  }
}

filter {
  mutate {
    add_field => {
      "fips_test" => "true"
    }
  }
}

output {
  http {
    url => "https://elasticsearch:9200/logstash-http-weak-ssl-test/_doc"
    http_method => "post"
    format => "json"
    content_type => "application/json"
    user => "elastic"
    password => "changeme"
    ssl_enabled => true
    ssl_verification_mode => "full"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
    ssl_supported_protocols => ["TLSv1.1"]
  }

  stdout {
    codec => rubydebug
  }
}
