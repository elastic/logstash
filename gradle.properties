## org.gradle.native=false must live in jvmargs, not GRADLE_OPTS: a heap mismatch makes Gradle
## fork a single-use daemon using this jvmargs string directly, bypassing GRADLE_OPTS entirely.
## That forked process is where native services init and where Windows 2016 fails (no Windows
## 2016 build of gradle-fileevents.dll). See PR #19216 and #19483.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dorg.gradle.native=false
org.gradle.daemon=false

## from default 30 secs to 2 minutes network timeouts
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.idleConnectionTimeout=120000
