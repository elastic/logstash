# Example Logstash pipeline for the Filebeat `mysql` module.
#
# How it works:
#   * Filebeat ships mysql log lines to the `beats` input below.
#   * Each event carries `[fileset][module]` ("mysql") and `[fileset][name]`,
#     which select the branch that parses it.
#   * Parsed values are stored in nested fields such as
#     `[mysql][error][message]`. The `[a][b][c]` bracket syntax is
#     Logstash's way of addressing nested objects inside the event.
#
# Failure handling:
#   * If `grok` cannot match a line, it tags the event `_grokparsefailure`
#     and the remaining filters are skipped, so a malformed line can never
#     produce bogus `date`/`geoip` output.
#   * If `date` cannot parse the timestamp, it tags the event
#     `_dateparsefailure` and `@timestamp` keeps the time the event was read.
input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}
filter {
  if [fileset][module] == "mysql" {
    if [fileset][name] == "error" {
      # Three patterns are tried in order and the first one that matches wins:
      # 1. "<id> <time> [<level>] <message>"       -> [mysql][error][message]
      # 2. "<iso8601> <thread> [<level>] <message>" -> [mysql][error][message1]
      # 3. anything else                               -> [mysql][error][message2]
      # The two `mutate` renames below normalize message1/message2 back to
      # [mysql][error][message]; each only fires when its pattern matched,
      # i.e. only when the earlier patterns failed.
      grok {
        match => { "message" => ["^%{LOCALDATETIME:[mysql][error][timestamp]} (\[%{DATA:[mysql][error][level]}\] )?%{GREEDYDATA:[mysql][error][message]}$",
          "^%{TIMESTAMP_ISO8601:[mysql][error][timestamp]} %{NUMBER:[mysql][error][thread_id]} \[%{DATA:[mysql][error][level]}\] %{GREEDYDATA:[mysql][error][message1]}$",
          "%{GREEDYDATA:[mysql][error][message2]}"] }
        pattern_definitions => {
          "LOCALDATETIME" => "[0-9]+ %{TIME}"
        }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          rename => { "[mysql][error][message1]" => "[mysql][error][message]" }
        }
        mutate {
          rename => { "[mysql][error][message2]" => "[mysql][error][message]" }
        }
        date {
          match => [ "[mysql][error][timestamp]", "ISO8601", "YYMMdd H:m:s" ]
          remove_field => "[mysql][error][time]"
        }
      }
    }
    else if [fileset][name] == "slowlog" {
      # Parse a slow-query-log entry. "SET timestamp=..." is optional;
      # when it is absent the `date` filter below is skipped via the
      # _grokparsefailure guard and @timestamp keeps the read time.
      grok {
        match => { "message" => ["^# User@Host: %{USER:[mysql][slowlog][user]}(\[[^\]]+\])? @ %{HOSTNAME:[mysql][slowlog][host]} \[(IP:[mysql][slowlog][ip])?\](\s*Id:\s* %{NUMBER:[mysql][slowlog][id]})?\n# Query_time: %{NUMBER:[mysql][slowlog][query_time][sec]}\s* Lock_time: %{NUMBER:[mysql][slowlog][lock_time][sec]}\s* Rows_sent: %{NUMBER:[mysql][slowlog][rows_sent]}\s* Rows_examined: %{NUMBER:[mysql][slowlog][rows_examined]}\n(SET timestamp=%{NUMBER:[mysql][slowlog][timestamp]};\n)?%{GREEDYMULTILINE:[mysql][slowlog][query]}"] }
        pattern_definitions => {
          "GREEDYMULTILINE" => "(.|\n)*"
        }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        date {
          match => [ "[mysql][slowlog][timestamp]", "UNIX" ]
        }
        mutate {
          gsub => ["[mysql][slowlog][query]", "\n# Time: [0-9]+ [0-9][0-9]:[0-9][0-9]:[0-9][0-9](\\.[0-9]+)?$", ""]
        }
      }
    }
  }
}
output {
  elasticsearch {
    hosts => localhost
    manage_template => false
    index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
}
