# Example Logstash pipeline for the Filebeat `nginx` module.
#
# How it works:
#   * Filebeat ships nginx log lines to the `beats` input below.
#   * Each event carries `[fileset][module]` ("nginx") and `[fileset][name]`,
#     which select the branch that parses it.
#   * Parsed values are stored in nested fields such as
#     `[nginx][access][remote_ip]`. The `[a][b][c]` bracket syntax is
#     Logstash's way of addressing nested objects inside the event.
#
# Failure handling:
#   * If `grok` cannot match a line, it tags the event `_grokparsefailure`
#     and the remaining filters are skipped, so a malformed line can never
#     produce bogus `date`/`geoip` output.
#   * If `date` cannot parse the timestamp, it tags the event
#     `_dateparsefailure` and `@timestamp` keeps the time the event was read.
input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}
filter {
  if [fileset][module] == "nginx" {
    if [fileset][name] == "access" {
      # Parse a combined-log-format access line. The pattern is anchored
      # (^ ... $) so the whole line must match; a partial match can never
      # silently succeed.
      grok {
        match => { "message" => ["^%{IPORHOST:[nginx][access][remote_ip]} - %{DATA:[nginx][access][user_name]} \[%{HTTPDATE:[nginx][access][time]}\] \"%{WORD:[nginx][access][method]} %{DATA:[nginx][access][url]} HTTP/%{NUMBER:[nginx][access][http_version]}\" %{NUMBER:[nginx][access][response_code]} %{NUMBER:[nginx][access][body_sent][bytes]} \"%{DATA:[nginx][access][referrer]}\" \"%{DATA:[nginx][access][agent]}\""] }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          add_field => { "read_timestamp" => "%{@timestamp}" }
        }
        date {
          match => [ "[nginx][access][time]", "dd/MMM/YYYY:H:m:s Z" ]
          remove_field => "[nginx][access][time]"
        }
        useragent {
          source => "[nginx][access][agent]"
          target => "[nginx][access][user_agent]"
          remove_field => "[nginx][access][agent]"
        }
        geoip {
          source => "[nginx][access][remote_ip]"
          target => "[nginx][access][geoip]"
        }
      }
    }
    else if [fileset][name] == "error" {
      # Parse an nginx error line:
      # "<time> [<level>] <pid>#<tid>: (*<connection_id> )?<message>"
      grok {
        match => { "message" => ["^%{DATA:[nginx][error][time]} \[%{DATA:[nginx][error][level]}\] %{NUMBER:[nginx][error][pid]}#%{NUMBER:[nginx][error][tid]}: (\*%{NUMBER:[nginx][error][connection_id]} )?%{GREEDYDATA:[nginx][error][message]}$"] }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          rename => { "@timestamp" => "read_timestamp" }
        }
        date {
          match => [ "[nginx][error][time]", "YYYY/MM/dd H:m:s" ]
          remove_field => "[nginx][error][time]"
        }
      }
    }
  }
}
output {
  elasticsearch {
    hosts => localhost
    manage_template => false
    index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
}
