# Example Logstash pipeline for the Filebeat `apache2` module.
#
# How it works:
#   * Filebeat ships apache2 log lines to the `beats` input below.
#   * Each event carries `[fileset][module]` ("apache2") and `[fileset][name]`,
#     which select the branch that parses it.
#   * Parsed values are stored in nested fields such as
#     `[apache2][access][remote_ip]`. The `[a][b][c]` bracket syntax is
#     Logstash's way of addressing nested objects inside the event.
#
# Failure handling:
#   * If `grok` cannot match a line, it tags the event `_grokparsefailure`
#     and the remaining filters are skipped, so a malformed line can never
#     produce bogus `date`/`geoip` output.
#   * If `date` cannot parse the timestamp, it tags the event
#     `_dateparsefailure` and `@timestamp` keeps the time the event was read.
input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}
filter {
  if [fileset][module] == "apache2" {
    if [fileset][name] == "access" {
      # Two patterns are tried in order and the first one that matches wins:
      # 1. the full combined log format (with referrer and user agent),
      # 2. a shorter variant used when those fields are logged as "-".
      grok {
        match => { "message" => ["^%{IPORHOST:[apache2][access][remote_ip]} - %{DATA:[apache2][access][user_name]} \[%{HTTPDATE:[apache2][access][time]}\] \"%{WORD:[apache2][access][method]} %{DATA:[apache2][access][url]} HTTP/%{NUMBER:[apache2][access][http_version]}\" %{NUMBER:[apache2][access][response_code]} %{NUMBER:[apache2][access][body_sent][bytes]}( \"%{DATA:[apache2][access][referrer]}\")?( \"%{DATA:[apache2][access][agent]}\")?$",
          "^%{IPORHOST:[apache2][access][remote_ip]} - %{DATA:[apache2][access][user_name]} \\[%{HTTPDATE:[apache2][access][time]}\\] \"-\" %{NUMBER:[apache2][access][response_code]} -$" ] }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          add_field => { "read_timestamp" => "%{@timestamp}" }
        }
        date {
          match => [ "[apache2][access][time]", "dd/MMM/YYYY:H:m:s Z" ]
          remove_field => "[apache2][access][time]"
        }
        useragent {
          source => "[apache2][access][agent]"
          target => "[apache2][access][user_agent]"
          remove_field => "[apache2][access][agent]"
        }
        geoip {
          source => "[apache2][access][remote_ip]"
          target => "[apache2][access][geoip]"
        }
      }
    }
    else if [fileset][name] == "error" {
      # Two error-log formats are tried in order. Pattern 1 captures the
      # message into [apache2][error][message] directly; pattern 2 captures
      # it into [apache2][error][message1], which the `mutate` rename below
      # moves to [apache2][error][message] -- so the rename only ever fires
      # when the first pattern failed to match.
      grok {
        match => { "message" => ["^\[%{APACHE_TIME:[apache2][error][timestamp]}\] \[%{LOGLEVEL:[apache2][error][level]}\]( \[client %{IPORHOST:[apache2][error][client]}\])? %{GREEDYDATA:[apache2][error][message]}$",
          "^\[%{APACHE_TIME:[apache2][error][timestamp]}\] \[%{DATA:[apache2][error][module]}:%{LOGLEVEL:[apache2][error][level]}\] \[pid %{NUMBER:[apache2][error][pid]}(:tid %{NUMBER:[apache2][error][tid]})?\]( \[client %{IPORHOST:[apache2][error][client]}\])? %{GREEDYDATA:[apache2][error][message1]}$" ] }
        pattern_definitions => {
          "APACHE_TIME" => "%{DAY} %{MONTH} %{MONTHDAY} %{TIME} %{YEAR}"
        }
        remove_field => "message"
      }
      if "_grokparsefailure" not in [tags] {
        mutate {
          rename => { "[apache2][error][message1]" => "[apache2][error][message]" }
        }
        date {
          match => [ "[apache2][error][timestamp]", "EEE MMM dd H:m:s YYYY", "EEE MMM dd H:m:s.SSSSSS YYYY" ]
          remove_field => "[apache2][error][timestamp]"
        }
      }
    }
  }
}
output {
  elasticsearch {
    hosts => localhost
    manage_template => false
    index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
}
