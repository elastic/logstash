name: bump-minor-logstash-version

# Mechanical "before feature freeze" steps for a minor release: cut the release
# branch, copy the previous minor's lock file onto it, and bump versions.yml on
# the branch it was cut from. Pin review and dependency updates stay manual.

on:
  workflow_dispatch:
    inputs:
      logstash-version:
        description: 'Release version for the new branch (example: 9.6.0)'
        required: true
        type: string
      logstash-branch:
        description: 'New release branch to create (example: 9.6)'
        required: true
        type: string
      source-branch:
        description: 'Branch the release branch is cut from and whose versions.yml is bumped to the next minor (example: main)'
        required: false
        default: main
        type: string
      next-minor-version:
        description: 'Version source-branch moves to after the branch is cut (example: 9.7.0). Computed from logstash-version when omitted.'
        required: false
        type: string
      previous-branch:
        description: 'Branch to copy the baseline lock file from (example: 9.5). Computed from logstash-branch when omitted.'
        required: false
        type: string
      skip-branch-creation:
        description: 'Skip creating the release branch (last minor of a major).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  create-release-branch:
    if: ${{ inputs.skip-branch-creation != true }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-branch }}
          fetch-depth: 0
      - name: Create release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGSTASH_BRANCH: ${{ inputs.logstash-branch }}
        run: |
          if git ls-remote --exit-code --heads origin "${LOGSTASH_BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${LOGSTASH_BRANCH} already exists, skipping creation."
          else
            git push origin "HEAD:refs/heads/${LOGSTASH_BRANCH}"
          fi

  # Copy the previous minor's lock file onto the new branch and pin logstash-core
  # to the release version.
  add-release-lockfile:
    needs: [create-release-branch]
    if: ${{ inputs.skip-branch-creation != true }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.logstash-branch }}
      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve previous branch
        id: prev
        env:
          PREVIOUS_BRANCH: ${{ inputs.previous-branch }}
          LOGSTASH_BRANCH: ${{ inputs.logstash-branch }}
        run: |
          if [ -n "$PREVIOUS_BRANCH" ]; then
            echo "branch=${PREVIOUS_BRANCH}" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r major minor <<< "$LOGSTASH_BRANCH"
            echo "branch=${major}.$((minor - 1))" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy baseline lock file and pin logstash-core
        env:
          PREVIOUS_BRANCH: ${{ steps.prev.outputs.branch }}
          LOGSTASH_VERSION: ${{ inputs.logstash-version }}
        run: |
          LOCK_FILE="Gemfile.jruby-3.4.lock.release"
          git fetch --depth 1 origin "${PREVIOUS_BRANCH}"
          git show "FETCH_HEAD:${LOCK_FILE}" > "${LOCK_FILE}"
          sed -i "s/logstash-core (= [0-9.]*/logstash-core (= ${LOGSTASH_VERSION}/" "${LOCK_FILE}"
          sed -i "s/logstash-core ([0-9.]*-java)/logstash-core (${LOGSTASH_VERSION}-java)/" "${LOCK_FILE}"
          sed -i "s/^logstash: .*/logstash: ${LOGSTASH_VERSION}/" versions.yml
          sed -i "s/^logstash-core: .*/logstash-core: ${LOGSTASH_VERSION}/" versions.yml
      - name: Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGSTASH_BRANCH: ${{ inputs.logstash-branch }}
          LOGSTASH_VERSION: ${{ inputs.logstash-version }}
          PREVIOUS_BRANCH: ${{ steps.prev.outputs.branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; exit 0; fi
          HEAD_BRANCH="add_lockfile_${LOGSTASH_VERSION}"
          if git ls-remote --exit-code --heads origin "${HEAD_BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${HEAD_BRANCH} already exists, skipping."
            exit 0
          fi
          git checkout -b "${HEAD_BRANCH}"
          git add versions.yml Gemfile.jruby-3.4.lock.release
          git commit -m "Add ${LOGSTASH_VERSION} lock file copied from ${PREVIOUS_BRANCH}"
          git push origin "${HEAD_BRANCH}"
          gh pr create \
            --title "Add ${LOGSTASH_VERSION} lock file" \
            --body "Baseline lock file copied unchanged from ${PREVIOUS_BRANCH} with logstash-core pinned to ${LOGSTASH_VERSION}. Merge before running the dependency bump against ${LOGSTASH_BRANCH}." \
            --base "${LOGSTASH_BRANCH}" \
            --head "${HEAD_BRANCH}"

  bump-source-branch-versions:
    needs: [create-release-branch]
    if: always() && (needs.create-release-branch.result == 'success' || needs.create-release-branch.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-branch }}
      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute next minor version
        id: next
        env:
          NEXT_MINOR_VERSION: ${{ inputs.next-minor-version }}
          LOGSTASH_VERSION: ${{ inputs.logstash-version }}
        run: |
          if [ -n "$NEXT_MINOR_VERSION" ]; then
            echo "version=${NEXT_MINOR_VERSION}" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r major minor _patch <<< "$LOGSTASH_VERSION"
            echo "version=${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          LOGSTASH_BRANCH: ${{ inputs.logstash-branch }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          sed -i "s/^logstash: .*/logstash: ${NEXT_VERSION}/" versions.yml
          sed -i "s/^logstash-core: .*/logstash-core: ${NEXT_VERSION}/" versions.yml
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; exit 0; fi
          HEAD_BRANCH="bump_${SOURCE_BRANCH}_versions_${NEXT_VERSION}"
          if git ls-remote --exit-code --heads origin "${HEAD_BRANCH}" > /dev/null 2>&1; then
            echo "Branch ${HEAD_BRANCH} already exists, skipping."
            exit 0
          fi
          git checkout -b "${HEAD_BRANCH}"
          git add versions.yml
          git commit -m "Bump versions.yml on ${SOURCE_BRANCH} to ${NEXT_VERSION}"
          git push origin "${HEAD_BRANCH}"
          gh pr create \
            --title "Bump versions.yml on ${SOURCE_BRANCH} to ${NEXT_VERSION}" \
            --body "Move ${SOURCE_BRANCH} to the next minor now that ${LOGSTASH_BRANCH} has been branched off." \
            --base "${SOURCE_BRANCH}" \
            --head "${HEAD_BRANCH}"
